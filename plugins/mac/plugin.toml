# Her own computer, a Mac: the four servers setup.sh runs behind its gateway, filled from
# the form (settings.toml): ${URL} is the Address, ${TOKEN} the Token; and its drones.
id = "mac"
label = "Her Mac"
about = "Her own Mac: its screen, a shell and its files, and a browser."
off_when = "Turn it off if the Mac is off or nobody is logged in."
group = "computer"
choice = "Own computer"
routes = ["gateway:router"]
run = "gateway:run"
open = ["GET /setup.sh", "GET /setup/{token}", "POST /gateway", "POST /events"]   # the Mac reaches these without a session

# The device "mac" for drones (server/celine/sub_agents/drone.py): opencode serve at the
# Agents address, its password the Token; its model calls come to the app's model proxy
# with `key`, the secret var/secrets/mac.link.key (gateway.py makes it).
[drones]
url      = "${AGENTS}"
password = "${TOKEN}"
share    = "${SHARE}"           # share.js (setup.sh): her shares of its ports and files, shares.py
key      = "link"
label    = "Her Mac"
about    = "${ABOUT}"           # what setup.sh reported of the Mac (gateway.py about)

[servers.macscreen]               # Peekaboo: see, click, type, menus, windows
enabled   = true
transport = "http"
url       = "${URL}/screen/mcp"
sends     = "house"

[servers.macscreen.headers]
Authorization = "Bearer ${TOKEN}"

# Each server's rows (server/celine/skills/words.py fill): a sentence per tool, {argument}
# the call's argument (its first line, cut), {argument|text} with what it says without
# one; and the words of a run of calls in a row, {n} their count.
[servers.macscreen.words]
see          = "Looked at the screen of the Mac"
image        = "Took a screenshot on the Mac"
capture      = "Recorded the screen of the Mac"
inspect_ui   = "Read the windows of the Mac"
analyze      = "Asked \"{question}\" about a picture on the Mac"
verify_state = "Checked the screen of the Mac"
click        = "Clicked {query} on the Mac"
type         = "Typed \"{text}\" on the Mac"
paste        = "Pasted on the Mac"
set_value    = "Set \"{value}\" on the Mac"
select_text  = "Chose the text \"{text}\" on the Mac"
action       = "Used {action} on the Mac"
press        = "Pressed {key|keys} on the Mac"
scroll       = "Scrolled {direction} on the Mac"
drag         = "Dragged on the Mac"
move         = "Moved the pointer on the Mac"
app          = "Used the app {name} on the Mac"
window       = "Used a window on the Mac"
menu         = "Used the menu {path|item} on the Mac"
dock         = "Used the Dock on the Mac"
dialog       = "Answered a dialog on the Mac"
clipboard    = "Used the clipboard on the Mac"
space        = "Used the desktops on the Mac"
browser      = "Used a browser on the Mac"
agent        = "Asked the screen agent \"{task}\" on the Mac"
sleep        = "Waited on the Mac"

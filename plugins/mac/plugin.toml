# Her own computer, a Mac: the servers setup.sh runs behind its gateway. Copy this folder
# to <data>/plugins/mac/. ${URL} is the Address field of settings.toml and ${SECRET} the
# token; setup.sh prints both.
id = "mac"
label = "Her Mac"
about = "Her own Mac: its screen, a shell and its files, and a browser."
off_when = "The Mac is off or nobody is logged in."
card = "detect"

[servers.macscreen]               # Peekaboo: see, click, type, menus, windows
enabled   = true
transport = "http"
url       = "${URL}/screen/mcp"
sends     = "house"

[servers.macscreen.headers]
Authorization = "Bearer ${SECRET}"

[servers.macshell]                # Desktop Commander: commands, processes, files
enabled   = true
transport = "http"
url       = "${URL}/shell/mcp"
sends     = "house"

[servers.macshell.headers]
Authorization = "Bearer ${SECRET}"

[servers.macbrowser]              # Playwright MCP: a browser with its own profile
enabled   = true
transport = "http"
url       = "${URL}/browser/mcp"
sends     = "public"

[servers.macbrowser.headers]
Authorization = "Bearer ${SECRET}"

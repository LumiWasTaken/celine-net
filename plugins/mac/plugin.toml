# Her own computer, a Mac: the four servers setup.sh runs behind its gateway, filled from
# the form (settings.toml): ${URL} is the Address, ${TOKEN} the Token; and its drones.
id = "mac"
label = "Her Mac"
about = "Her own Mac: its screen, a shell and its files, and a browser."
off_when = "The Mac is off or nobody is logged in."
card = "always"
group = "computer"
choice = "Own computer"
routes = ["gateway:router"]
run = "gateway:run"
open = ["GET /setup.sh", "POST /gateway", "POST /events"]   # the Mac reaches these without a session

# The device "mac" for drones (server/celine/sub_agents/drone.py): opencode serve at the
# Agents address, its password the Token; its model calls come to the app's model proxy
# with `key`, the secret var/secrets/mac.link.key (gateway.py makes it).
[drones]
url      = "${AGENTS}"
password = "${TOKEN}"
share    = "${SHARE}"           # share.js (setup.sh): her shares of its ports and files, shares.py
key      = "link"
label    = "Her Mac"

[servers.macscreen]               # Peekaboo: see, click, type, menus, windows
enabled   = true
transport = "http"
url       = "${URL}/screen/mcp"
sends     = "house"

[servers.macscreen.headers]
Authorization = "Bearer ${TOKEN}"

[servers.macshell]                # Desktop Commander: commands, processes, files
enabled   = true
transport = "http"
url       = "${URL}/shell/mcp"
sends     = "house"

[servers.macshell.headers]
Authorization = "Bearer ${TOKEN}"

[servers.macbrowser]              # Playwright MCP: Chrome with its own profile
enabled   = true
transport = "http"
url       = "${URL}/browser/mcp"
sends     = "public"

[servers.macbrowser.headers]
Authorization = "Bearer ${TOKEN}"

[servers.macfiles]                # the MCP filesystem server: its files, any file into the chat
enabled   = true
transport = "http"
url       = "${URL}/files/mcp"
sends     = "house"

[servers.macfiles.headers]
Authorization = "Bearer ${TOKEN}"

# One image per Dockerfile, pushed to this repository's GitHub container registry:
#   ghcr.io/<owner>/celine-net/celine-app, celine-shellbox, celine-browser,
#   celine-shellbox-manager, celine-discord-link, celine-wa-link
# Tags: latest (master), the tag as it was pushed (v1.2), its semver when it is one
# (v1.2.0: 1.2.0), and the commit. CHANGELOG.md says what each version changed.
name: images
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: celine-app, file: Dockerfile}
          - {name: celine-shellbox, file: shellbox/Dockerfile}
          - {name: celine-browser, file: browser/Dockerfile}
          - {name: celine-shellbox-manager, file: shellbox-manager/Dockerfile}
          - {name: celine-discord-link, file: connectors/discord/Dockerfile}
          - {name: celine-wa-link, file: wa-link/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CELINE_COMMIT=${{ github.sha }}
            SHELLBOX_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

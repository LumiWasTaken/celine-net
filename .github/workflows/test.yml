# The gates (AGENT.md "Gates") on every push and pull request: the Python tests (in
# parallel, then in one process) and ruff, the web build (useReveal check, eslint, tsc,
# vite) and the WhatsApp connector's tests. After all three pass on master or on a v*
# tag, `images` builds one image per Dockerfile and pushes it to
# ghcr.io/<owner>/<repo>/<name>:
#   master:  latest and the short commit
#   v* tag:  stable, the tag (v2.1.0) and the short commit
# docker-compose.yml takes them with CELINE_IMAGES=ghcr.io/<owner>/<repo> and CELINE_TAG.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      # shellboxd reads other processes' syscalls, as it does in the box (SYS_PTRACE)
      - run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - run: uv run pytest
      - run: uv run pytest -n0
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  wa-link:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa-link
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: wa-link/go.mod
          cache-dependency-path: wa-link/go.sum
      - run: go test ./...
      - run: go vet ./...
  images:
    needs: [python, web, wa-link]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: celine-app, file: Dockerfile}
          - {name: celine-shellbox, file: shellbox/Dockerfile}
          - {name: celine-browser, file: browser/Dockerfile}
          - {name: celine-shellbox-manager, file: shellbox-manager/Dockerfile}
          - {name: celine-discord-link, file: connectors/discord/Dockerfile}
          - {name: celine-wa-link, file: wa-link/Dockerfile}
    steps:
      - uses: actions/checkout@v5
      - id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag
            type=sha,format=short,prefix=
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CELINE_COMMIT=${{ github.sha }}
            SHELLBOX_COMMIT=${{ github.sha }}
            CELINE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

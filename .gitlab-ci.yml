# celine-net: tests, then one image per Dockerfile, pushed to this project's registry.
#   $CI_REGISTRY_IMAGE/celine-app              Dockerfile
#   $CI_REGISTRY_IMAGE/celine-discord-link     connectors/discord/Dockerfile
#   $CI_REGISTRY_IMAGE/celine-wa-link          wa-link/Dockerfile
#   $CI_REGISTRY_IMAGE/celine-shellbox-manager shellbox-manager/Dockerfile
#   $CI_REGISTRY_IMAGE/celine-shellbox         shellbox/Dockerfile
#   $CI_REGISTRY_IMAGE/celine-browser          browser/Dockerfile
# Every image is tagged with the branch or tag slug, and :latest on master.
# A push runs only the jobs whose files changed (rules: changes); an image that did not
# change keeps its last tag. "Run pipeline" by hand, or a change to this file, runs every job.
# Each build waits only for the tests of what it ships (needs), and reuses the layers of
# its last build from the registry (:buildcache), so a code change skips the installs. The
# Dockerfiles take the code with COPY --link and run nothing after it, so such a build
# never downloads the big layers below it, and the commit is their last layer.
# Pipelines run on master only (and "Run pipeline" by hand): pushes to other branches build nothing.

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - build

# ---- test ----------------------------------------------------------------------------

# the app and the Discord connector (pytest collects tests/ and connectors/discord/tests)
test:python:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: [pyproject.toml, uv.lock, server/**/*, tests/**/*, config/**/*,
                connectors/discord/**/*, shellbox/**/*, browser/**/*, .gitlab-ci.yml]
  image: ghcr.io/astral-sh/uv:0.12.18-python3.14-trixie-slim
  variables:
    UV_PYTHON_DOWNLOADS: never
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  script:
    - uv sync --locked
    - uv run pytest
    - uv cache prune --ci

# the WhatsApp connector
test:wa-link:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: [wa-link/**/*, .gitlab-ci.yml]
  image: golang:1.27.1-alpine3.24
  variables:
    CGO_ENABLED: "0"
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.go/build
  cache:
    key:
      files: [wa-link/go.sum]
    paths: [.go/pkg/mod, .go/build]
  script:
    - cd wa-link
    - go test ./...

# the web UI: the production build, which type checks first (tsc -b)
test:web:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: [web/**/*, .gitlab-ci.yml]
  image: node:22.23.3-trixie-slim
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm]
  script:
    - cd web
    - npm ci --no-audit --no-fund --prefer-offline --cache ../.npm
    - npm run build

# ---- build ---------------------------------------------------------------------------

.build-image:
  stage: build
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - IMG="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    - TAGS="-t $IMG:$CI_COMMIT_REF_SLUG"
    - if [ "$CI_COMMIT_BRANCH" = "master" ]; then TAGS="$TAGS -t $IMG:latest"; fi
    # a BuildKit container: the plain docker driver cannot keep a cache in the registry;
    # it needs a context, buildx does not take the dind TLS settings from the environment
    - docker context create ci
    - docker buildx create --use --driver docker-container ci
    - docker buildx build --push --provenance=false $BUILD_ARGS $TAGS -f "$DOCKERFILE"
        --cache-from "type=registry,ref=$IMG:buildcache"
        --cache-to "type=registry,ref=$IMG:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
        .

build:app:
  extends: .build-image
  needs:
    - {job: "test:python", optional: true}
    - {job: "test:web", optional: true}
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: [Dockerfile, pyproject.toml, uv.lock, server/**/*, web/**/*, config/**/*,
                .gitlab-ci.yml]
  variables:
    DOCKERFILE: Dockerfile
    IMAGE_NAME: celine-app
    BUILD_ARGS: --build-arg CELINE_COMMIT=$CI_COMMIT_SHORT_SHA --build-arg CELINE_BUILT=$CI_PIPELINE_CREATED_AT

build:discord-link:
  extends: .build-image
  needs:
    - {job: "test:python", optional: true}
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: [connectors/discord/**/*, .gitlab-ci.yml]
  variables:
    DOCKERFILE: connectors/discord/Dockerfile
    IMAGE_NAME: celine-discord-link

build:wa-link:
  extends: .build-image
  needs:
    - {job: "test:wa-link", optional: true}
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: [wa-link/**/*, .gitlab-ci.yml]
  variables:
    DOCKERFILE: wa-link/Dockerfile
    IMAGE_NAME: celine-wa-link

build:shellbox-manager:
  extends: .build-image
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: [shellbox-manager/**/*, .gitlab-ci.yml]
  variables:
    DOCKERFILE: shellbox-manager/Dockerfile
    IMAGE_NAME: celine-shellbox-manager

build:shellbox:
  extends: .build-image
  needs:
    - {job: "test:python", optional: true}
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: [shellbox/**/*, .gitlab-ci.yml]
  variables:
    DOCKERFILE: shellbox/Dockerfile
    IMAGE_NAME: celine-shellbox
    BUILD_ARGS: --build-arg SHELLBOX_COMMIT=$CI_COMMIT_SHORT_SHA

build:browser:
  extends: .build-image
  needs:
    - {job: "test:python", optional: true}
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: [browser/**/*, .gitlab-ci.yml]
  variables:
    DOCKERFILE: browser/Dockerfile
    IMAGE_NAME: celine-browser

# The LLM request queue (server/celine/backends/queue.py, backends/llm.py).
# Every chat/completion call waits here for a slot: the user's turn first, then
# agent turns (triggers, jobs, sub-agents), then background calls (titles).
# Conversations of the same priority take turns (round-robin per model call).
# Read live: saving this file applies it.
#
# Servers, models, slots per model and which model does which task are
# Settings, Models (var/settings/providers.toml and roles.toml).

[queue]
wait_seconds            = 0     # a turn's request waits this long for a slot; 0: as long as it takes (Stop ends it)
background_wait_seconds = 120   # titles and other background calls

# The GPU an image or a song needs is the one the text models run on (the "Shares its GPU with"
# setting of a text provider in Settings, Models). Text goes first: an image waits until no text
# request runs or waits on that server, and then gpu_idle_seconds more, so a
# conversation that is still talking is not interrupted by a model swap. Text that
# arrives while an image renders waits for it, as long as it takes. After
# gpu_patience_seconds of waiting the image goes next anyway, so a stream of agent work
# cannot starve it.
gpu_idle_seconds        = 10
gpu_patience_seconds    = 600

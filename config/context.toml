# What it carries in one request besides its persona, how it talks and the
# conversation itself (server/celine/turns/loads.py). Copied once to
# var/settings/context.toml; edit that copy.
#
# Notes: the always-loaded ones (a `load: always` line, the notes on you) are in its
# instructions; any other note comes back as the result of reading it. Every tool is in
# its list, a core skill's with its parameters, every other by name; skills__load answers
# with the parameters.
#
# The agent's memory: a note whose `keys:` line names a word or phrase of the new message or
# the start of its last reply brings up its sections, graded by embedding similarity,
# under [your memory] at the end of the message (server/celine/skills/recall.py).

memory_floor = 0.5  # how similar a section must be to the conversation to come back (0 to 1)
memory_sections = 3 # at most this many sections per message
memory_tokens = 1500  # in at most this many tokens

# One tool result takes at most this many tokens, or 15 % of the model's window when
# that is less; past it its start and its end are kept, with a [cut: ...] line between.
result_tokens = 10000

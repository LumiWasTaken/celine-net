# The shellbox's own tmux server, on its own socket (tmux -L shellbox). It holds Celine's
# terminals; its own `tmux` and ~/.tmux.conf are separate from it.
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g status off
set -g prefix None
set -g prefix2 None
set -g escape-time 0
set -g remain-on-exit on
# a dead terminal shows its last output and nothing else
set -g remain-on-exit-format ""
set -g allow-rename off
set -g set-titles off
set -g focus-events off
set -wg automatic-rename off
# no `window-size manual`: tmux 3.5a crashes on new-session with it. Each window gets
# its size from `resize-window`, which makes that one window manual.
# the terminal page's viewer draws in the normal screen, not the alternate one: the
# history the page wrote first stays in its scrollback under the live screen
set -as terminal-overrides ',*:smcup@:rmcup@'

[project]
name = "discord-link"
version = "0.1.0"
description = "celine-net's Discord connector: one account, read tools over MCP, a feed for the archive"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=43",
    "segno>=1.6",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[project.scripts]
discord-link = "discord_link.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["discord_link"]
